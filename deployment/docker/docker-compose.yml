version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: reelflow_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: reelflow123
      MONGO_INITDB_DATABASE: reelflow
    volumes:
      - mongodb_data:/data/db
    networks:
      - reelflow_network

  # Backend API
  backend:
    build: .
    container_name: reelflow_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://admin:reelflow123@mongodb:27017/reelflow?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
    networks:
      - reelflow_network

  # Nginx for static files
  nginx:
    image: nginx:alpine
    container_name: reelflow_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - reelflow_network

volumes:
  mongodb_data:

networks:
  reelflow_network:
    driver: bridge
